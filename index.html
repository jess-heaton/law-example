<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-bubble {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: white;
            border-radius: 24px;
            padding: 16px 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            z-index: 999999;
        }

        .chat-bubble:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
        }

        .chat-text {
            color: #333;
            font-size: 16px;
            font-weight: 500;
        }

        .cursor {
            width: 2px;
            height: 20px;
            background: #667eea;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% {
                opacity: 1;
            }
            50%, 100% {
                opacity: 0;
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .chat-bubble {
                bottom: 16px;
                right: 16px;
                padding: 14px 20px;
            }

            .chat-text {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-bubble" id="customChatButton">
        <span class="chat-text">Ask me anything</span>
        <div class="cursor"></div>
    </div>

    <script type="text/javascript">
        (function(d, t) {
            var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
            v.onload = function() {
                // Load the widget
                window.voiceflow.chat.load({
                    verify: { projectID: '695ce7fcb0a37ea269258fff' },
                    url: 'https://general-runtime.voiceflow.com',
                    versionID: 'production',
                    voice: { url: "https://runtime-api.voiceflow.com" }
                });

                // Wait a moment for widget to fully initialize, then hide the default launcher
                setTimeout(function() {
                    // Hide the default Voiceflow launcher button
                    window.voiceflow.chat.hide();
                    
                    // Add click handler to custom button
                    document.getElementById('customChatButton').addEventListener('click', function() {
                        window.voiceflow.chat.open();
                    });
                }, 500);
            }
            v.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs"; v.type = "text/javascript";
            s.parentNode.insertBefore(v, s);
        })(document, 'script');
    </script>
</body>
</html>
